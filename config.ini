# ============================================
# JCB 悠遊卡登錄程式設定檔
# ============================================

# 模式: 0=登錄, 1=查詢
mode = 0
testing = False

# Line Notify 權杖（留空則不發送通知）
linetoken =

# 開始時間 (HH:MM:SS)
start_time = 09:00:01

# Anticaptcha 設定
# max_token: 同時取得的 token 數量（建議 1，每張卡需要 1 個 token）
# get_token_semaphore: 同時取得 token 的並發數
# shoot_semaphore: 同時發送請求的並發數
max_token = 1
get_token_semaphore = 30
shoot_semaphore = 7

# Anticaptcha API Key（留空則需手動處理驗證碼）
api_key =

# 使用者名稱（用於 Line Notify 訊息辨識）
myname =

# ============================================
# 多組卡片設定
# 格式: 每組用雙引號包住，逗號分隔
# txtCreditCardVal = "['卡號前6','卡號中間2','卡號後4']", "['卡號前6','卡號中間2','卡號後4']"
# txtEasyCardVal = "['悠遊卡號前4','悠遊卡號次4','悠遊卡號次4','悠遊卡號後4']", "['悠遊卡號前4','悠遊卡號次4','悠遊卡號次4','悠遊卡號後4']"
# 注意: 信用卡與悠遊卡數量必須一致
# ============================================
txtCreditCardVal = "['123456','78','9012']", "['654321','09','8765']"
txtEasyCardVal = "['1234','5678','9012','3456']", "['6543','2109','8765','4321']"

# 已登錄卡號（程式會自動記錄，不需手動修改）
cardRecorded =

# 排除卡號（登錄時會跳過這些卡）
excludeCard =
